name: release-deploy

on:
  push:
    tags:
      - "vdisabled*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/www/wiki.aha00a.com
  HEALTH_PATH: /
  REDIS_FLUSHDB: "false"

jobs:
  deploy:
    name: Build and deploy on production server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Get runner public IP
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Allow SSH from runner IP
        run: |
          set -euo pipefail
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SSH_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-${{ github.run_id }}}]"

      - name: Execute remote build and deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          HEALTH_PATH: ${{ env.HEALTH_PATH }}
          REDIS_FLUSHDB: ${{ env.REDIS_FLUSHDB }}
          GIT_REF: ${{ github.ref_name }}
          GIT_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_DIR,HEALTH_PATH,REDIS_FLUSHDB,GIT_REF,GIT_REPOSITORY
          script: |
            set -euo pipefail

            APP_REPO_DIR="${APP_DIR}/repo"
            mkdir -p "${APP_DIR}" "${APP_DIR}/logs"

            if [ ! -d "${APP_REPO_DIR}/.git" ]; then
              git clone "https://github.com/${GIT_REPOSITORY}.git" "${APP_REPO_DIR}"
            fi

            cd "${APP_REPO_DIR}"
            git fetch --tags origin
            git checkout -f "${GIT_REF}"

            chmod +x stage.sh start10000.sh start10001.sh
            ./stage.sh

            pm2 delete start10000 || true
            rm -f target/universal/stage/RUNNING_PID_10000
            pm2 start start10000.sh --name start10000

            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:10000${HEALTH_PATH}" >/dev/null; then
                echo "start10000 is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "start10000 health check failed"
                exit 1
              fi
              sleep 2
            done

            if [ "${REDIS_FLUSHDB}" = "true" ]; then
              redis-cli -n 0 FLUSHDB
            fi

            pm2 delete start10001 || true
            rm -f target/universal/stage/RUNNING_PID_10001
            pm2 start start10001.sh --name start10001

            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:10001${HEALTH_PATH}" >/dev/null; then
                echo "start10001 is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "start10001 health check failed"
                exit 1
              fi
              sleep 2
            done

            pm2 save

      - name: Revoke SSH from runner IP
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_IP:-}" ]; then
            echo "RUNNER_IP is not set; skipping revoke."
            exit 0
          fi
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.AWS_SSH_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32}]" \
            || true
