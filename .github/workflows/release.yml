name: release-deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/www/wiki.aha00a.com
  HEALTH_PATH: /
  REDIS_FLUSHDB: "false"

jobs:
  build:
    name: Build on GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: sbt

      - name: Build stage
        run: ./stage.sh

      - name: Package artifact
        run: |
          set -euo pipefail
          tar -czf stage.tar.gz \
            target/universal/stage \
            conf \
            start10000.sh \
            start10001.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahawiki-stage
          path: stage.tar.gz
          retention-days: 3

  deploy:
    name: Deploy over SSH from GitHub-hosted runner
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ahawiki-stage
          path: /tmp/ahawiki-artifact

      - name: Create remote deploy script
        run: |
          cat > /tmp/deploy_remote.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          APP_DIR="${APP_DIR:-/home/ubuntu/www/wiki.aha00a.com}"
          HEALTH_PATH="${HEALTH_PATH:-/}"
          REDIS_FLUSHDB="${REDIS_FLUSHDB:-false}"
          RELEASE_ID="$1"

          RELEASES_DIR="${APP_DIR}/releases"
          RELEASE_DIR="${RELEASES_DIR}/${RELEASE_ID}"
          ARTIFACT_PATH="${APP_DIR}/incoming/stage.tar.gz"

          mkdir -p "${RELEASES_DIR}" "${APP_DIR}/incoming" "${APP_DIR}/logs"
          mkdir -p "${RELEASE_DIR}"

          tar -xzf "${ARTIFACT_PATH}" -C "${RELEASE_DIR}"
          ln -sfn "${RELEASE_DIR}" "${APP_DIR}/current"
          cd "${APP_DIR}/current"

          chmod +x start10000.sh start10001.sh

          pm2 delete start10000 || true
          rm -f target/universal/stage/RUNNING_PID_10000
          pm2 start start10000.sh --name start10000

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:10000${HEALTH_PATH}" >/dev/null; then
              echo "start10000 is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "start10000 health check failed"
              exit 1
            fi
            sleep 2
          done

          if [ "${REDIS_FLUSHDB}" = "true" ]; then
            redis-cli -n 0 FLUSHDB
          fi

          pm2 delete start10001 || true
          rm -f target/universal/stage/RUNNING_PID_10001
          pm2 start start10001.sh --name start10001

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:10001${HEALTH_PATH}" >/dev/null; then
              echo "start10001 is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "start10001 health check failed"
              exit 1
            fi
            sleep 2
          done

          pm2 save
          SCRIPT
          chmod +x /tmp/deploy_remote.sh

      - name: Prepare upload files
        run: |
          cp /tmp/ahawiki-artifact/stage.tar.gz ./stage.tar.gz
          cp /tmp/deploy_remote.sh ./deploy_remote.sh

      - name: Get runner public IP
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Allow SSH from runner IP
        run: |
          set -euo pipefail
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SSH_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-${{ github.run_id }}}]"

      - name: Upload artifact and script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "stage.tar.gz,deploy_remote.sh"
          target: "${{ env.APP_DIR }}/incoming"
          overwrite: true

      - name: Execute remote deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          HEALTH_PATH: ${{ env.HEALTH_PATH }}
          REDIS_FLUSHDB: ${{ env.REDIS_FLUSHDB }}
          RELEASE_ID: ${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_DIR,HEALTH_PATH,REDIS_FLUSHDB,RELEASE_ID
          script: |
            set -euo pipefail
            bash "${APP_DIR}/incoming/deploy_remote.sh" "${RELEASE_ID}"

      - name: Revoke SSH from runner IP
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_IP:-}" ]; then
            echo "RUNNER_IP is not set; skipping revoke."
            exit 0
          fi
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.AWS_SSH_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32}]" \
            || true
