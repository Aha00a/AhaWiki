<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>editor grid harness</title>
<link rel="stylesheet" href="/public/vendor/codemirror/codemirror.css"/>
<script>
// edit.page.js reads this. The candidate lists are empty; nothing here needs them.
window.AhaWikiEditConfig = {
    pageName: 'HarnessPage',
    api: {
        macroNames: '../editor-keys/empty.json',
        interpreterNames: '../editor-keys/empty.json',
        schemaClassNames: '../editor-keys/empty.json',
        schemaPropertyNames: '../editor-keys/empty.json',
        pageNames: '../editor-keys/empty.json'
    }
};
</script>
</head>
<body>
<!-- What edit.page.js looks up, from app/views/Wiki/edit.scala.html. -->
<div class="flash"></div>
<div class="left"><div class="toolbar"><a href="#" class="toggleTableEditor">Table</a></div>
    <form id="form">
        <div class="editorBody">
            <div id="tableInlineEditor" class="tableInlineEditor">
                <input type="text" id="tableInlineOption" value="tsv"/>
                <table class="tableBlockEditorGrid"><tbody id="tableInlineEditorGrid"></tbody></table>
            </div>
            <div id="ganttEditorBar"><button id="openGanttEditor" type="button">Gantt</button></div>
            <div id="ganttInlineEditor" class="ganttInlineEditor">
                <button id="ganttUndo" type="button" disabled>u</button><button id="ganttRedo" type="button" disabled>r</button>
                <table class="ganttEditorGrid"><tbody id="ganttInlineEditorGrid"></tbody></table>
            </div>
            <textarea name="text" id="text"></textarea>
        </div>
        <input type="text" name="comment"/>
    </form>
</div>
<div class="right"><div class="toolbar"></div><div class="previewPane"></div></div>

<h1>Editor grid harness</h1>
<p>Read <code>README.md</code> next to this file.</p>
<pre id="result">running…</pre>

<script>
// The page opens with a table block, as a block's Edit link opens it. Each cell is one that went
// wrong: a quote inside, a quote first, a whole quoted field, and the characters that must not be
// escaped twice.
const TABLE = [
    '[[[#!Table tsv 1',
    'Name\tNote',
    '27" monitor\t["Name: X"]',
    '"Phase 1" kickoff\ta&b &amp; <b>x</b>',
    "it's\t\" onfocus=\"window.injected=1\" x=\"",
    ']]]'
].join('\n');
const GANTT = [
    '[[[#!gantt',
    '"Phase 1" kickoff\t2026-11-21\t3\t50%',
    '\tit\'s "done"\t2026-11-24\t2',
    ']]]'
].join('\n');
document.getElementById('text').value = TABLE;
</script>
<script src="/public/vendor/jquery/jquery.min.js"></script>
<script src="/public/vendor/jquery-validation/jquery.validate.min.js"></script>
<script src="/public/vendor/jquery-form/jquery.form.min.js"></script>
<script src="/public/vendor/codemirror/codemirror.min.js"></script>
<script src="/public/js/jquery.hotkeys.js"></script>
<script src="/public/js/jquery.paste_image_reader.js"></script>
<script src="/public/js/AhaWiki.Editor.js"></script>
<script src="/public/js/AhaWiki.CodeMirror.AhaMark.js"></script>
<script src="/public/js/AhaWiki.WikipediaToSchema.js"></script>
<script src="/public/js/Wiki/edit.tableOptions.js"></script>
<script src="/public/js/Wiki/edit.page.js"></script>

<script>
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const out = [];
let bad = 0;
function say(s) { out.push(s); document.getElementById('result').textContent = out.join('\n'); console.log(s); }
function check(name, ok, detail) { if (!ok) bad++; say((ok ? 'OK   ' : 'FAIL ') + name + (ok || !detail ? '' : '\n     ' + detail)); }
const source = () => window.AhaWikiCodeMirrorEditor ? window.AhaWikiCodeMirrorEditor.getValue() : document.getElementById('text').value;
function type(input, value) { input.value = value; input.dispatchEvent(new Event('input', { bubbles: true })); }

(async () => {
    await sleep(1200);
    const grid = document.getElementById('tableInlineEditorGrid');
    const cells = [...grid.querySelectorAll('input')];
    check('the table opens in the grid', cells.length === 8, 'inputs: ' + cells.length);

    const expected = ['Name', 'Note', '27" monitor', '["Name: X"]', '"Phase 1" kickoff', 'a&b &amp; <b>x</b>', "it's", '" onfocus="window.injected=1" x="'];
    check('every cell shows its whole text', JSON.stringify(cells.map(c => c.value)) === JSON.stringify(expected),
        JSON.stringify(cells.map(c => c.value)));
    check('no cell text became an attribute of its input', cells.every(c => !c.hasAttribute('onfocus')) && !window.injected);

    // Edit one cell; the grid writes the whole block back. Everything else must come back as it was.
    type(cells[1], 'Remark');
    await sleep(400);
    check('an edit elsewhere writes every other cell back unchanged', source() === TABLE.replace('Name\tNote', 'Name\tRemark'),
        JSON.stringify(source()));

    // Back to text, then the Gantt grid, the same way.
    document.querySelector('.toggleTableEditor').click();
    await sleep(200);
    window.AhaWikiCodeMirrorEditor ? window.AhaWikiCodeMirrorEditor.setValue(GANTT) : (document.getElementById('text').value = GANTT);
    document.querySelector('.toggleTableEditor').click();
    await sleep(400);
    const names = [...document.querySelectorAll('#ganttInlineEditorGrid .ganttNameInput')];
    check('the gantt grid shows each task name whole', JSON.stringify(names.map(n => n.value)) === JSON.stringify(['"Phase 1" kickoff', 'it\'s "done"']),
        JSON.stringify(names.map(n => n.value)));
    const start = document.querySelector('#ganttInlineEditorGrid .ganttStartOrRefInput');
    type(start, '2026-11-22');
    await sleep(400);
    check('an edit in the gantt grid keeps the task names', source().includes('"Phase 1" kickoff\t2026-11-22\t3\t50%') && source().includes('\tit\'s "done"\t2026-11-24\t2'),
        JSON.stringify(source()));

    say(bad === 0 ? 'PASS' : 'FAIL — ' + bad);
    document.title = 'done';
})();
</script>
</body>
</html>
