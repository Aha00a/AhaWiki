<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>slide notes harness</title>
<link rel="stylesheet" href="../../../app/assets/wiki.css">
<style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
    #result { white-space: pre-wrap; }
</style>
</head>
<body class="AhaWiki">
<!-- What InterpreterSlide writes for four slides, all but the third with notes, the last a picture
     whose title is only in its notes (SlideUnit pins the
     server side). The checks below drive the real AhaWiki.Slide.js against the real wiki.css. The
     second slide's title and the last slide's notes are headings as the wiki writes them, with a
     number in front, inside the page's content, where the wiki draws a heading as a section of a
     document: in the notes that drew `0.1.` and an underline, and the line naming the next slide
     read the hidden number out (2026-11-18). -->
<div role="main" class="wikiContent"><div class="limitWidth">
<div class="slideDeck " tabindex="0" data-total="4">
<section class="slide" data-index="0">
  <div class="slideNumber">1 / 4</div>
  <div class="slideContent"><div><h1>첫 장</h1><p>audience-one</p></div></div>
  <aside class="slideNotes"><p>notes-one 첫 장에서 할 말</p></aside>
</section>
<section class="slide" data-index="1">
  <div class="slideNumber">2 / 4</div>
  <div class="slideContent"><div><div></div><div class="HeadingWrapper둘째-장"><div class="InterpreterRenderMetaWrapper" style="position: relative;"><div class="InterpreterRenderContent"><h1 id="둘째-장" class=""><a href="#둘째-장" aria-label="Link to this heading" class="headingNumber">1.</a> 둘째 장</h1></div></div>
<p>audience-two</p></div></div></div>
  <aside class="slideNotes"><p>notes-two</p></aside>
</section>
<section class="slide" data-index="2">
  <div class="slideNumber">3 / 4</div>
  <div class="slideContent"><div><h1>셋째 장</h1><p>audience-three</p></div></div>
</section>
<section class="slide" data-index="3">
  <div class="slideNumber">4 / 4</div>
  <div class="slideContent"><div><p>(only a picture)</p></div></div>
  <aside class="slideNotes"><div></div><div class="HeadingWrapper그림-장"><div class="InterpreterRenderMetaWrapper" style="position: relative;"><div class="InterpreterRenderContent"><h3 id="그림-장" class=""><a href="#그림-장" aria-label="Link to this heading" class="headingNumber">0.1.</a> 그림 장</h3></div></div>
<p>notes-four</p></div></aside>
</section>
  <div class="slideChrome">
    <div class="slideChromeGroup">
      <button type="button" class="slideFilmstrip" title="Filmstrip (L)" aria-label="Filmstrip" aria-pressed="false">&#9636;</button>
      <button type="button" class="slideOverview" title="Overview (O)" aria-label="Overview" aria-pressed="false">&#9638;</button>
    </div>
    <div class="slideChromeGroup">
      <button type="button" class="slidePrev" title="Previous slide (&#8592;)" aria-label="Previous slide">&#8249;</button>
      <span class="slideCounter"><span class="slideCurrent">1</span> / 4</span>
      <button type="button" class="slideNext" title="Next slide (&#8594;)" aria-label="Next slide">&#8250;</button>
    </div>
    <div class="slideChromeGroup">
      <span class="slideTimer" hidden></span>
      <button type="button" class="slideNotesToggle" title="Speaker notes (N)" aria-label="Speaker notes" aria-pressed="false">&#9998;</button>
      <button type="button" class="slidePresenter" title="Presenter window (P)" aria-label="Presenter window">&#9707;</button>
      <button type="button" class="slideFullscreen" title="Fullscreen (F)" aria-label="Fullscreen" aria-pressed="false">&#9974;</button>
      <button type="button" class="slideKeys" title="Keys (?)" aria-label="Keys" aria-pressed="false">?</button>
    </div>
  </div>
</div>
</div></div>
<pre id="result">running…</pre>
<script src="../../../public/js/AhaWiki.Slide.js"></script>
<script>
// In the presenter window this page is opened again; it only shows itself there.
if (!/^AhaWikiSlidePresenter/.test(window.name)) {
    window.addEventListener('load', async function () {
        const out = [];
        const check = (name, ok) => out.push((ok ? 'PASS ' : 'FAIL ') + name);
        const deck = document.querySelector('.slideDeck');
        const visible = (el) => !!el && getComputedStyle(el).display !== 'none' && el.getClientRects().length > 0;
        const asides = [...deck.querySelectorAll('.slideStage .slideNotes')];
        const panel = deck.querySelector('.slideNotesPanel');

        check('notes are hidden on the stage', asides.length === 3 && asides.every((a) => !visible(a)));
        // On by default since 2026-11-19; N folds it away and brings it back.
        const toggle = deck.querySelector('.slideNotesToggle');
        // Except under 768px, where it opens folded. Run the page that narrow to check that one.
        if (!matchMedia('(min-width: 768px)').matches) {
            check('under 768px the panel opens folded', !visible(panel) && toggle.getAttribute('aria-pressed') === 'false');
            toggle.click();
        }
        check('the panel is shown from the start', visible(panel) && toggle.getAttribute('aria-pressed') === 'true');
        toggle.click();
        check('N hides the panel', !visible(panel) && toggle.getAttribute('aria-pressed') === 'false');
        toggle.click();
        check('N shows the panel again', visible(panel));
        check('the panel shows the current slide\'s notes', panel.textContent.includes('notes-one'));
        // Its title, without the number the wiki puts in front of a heading.
        check('the panel names the next slide', panel.querySelector('.slideNotesNext').textContent === '→ 2. 둘째 장');
        check('the stage still shows the slide', visible(deck.querySelector('.slide.current .slideContent')));
        const stage = deck.querySelector('.slideStage').getBoundingClientRect();
        check('the panel sits under the stage', panel.getBoundingClientRect().top >= stage.bottom - 1);

        deck.querySelector('.slideNext').click();
        check('moving on changes the notes', panel.textContent.includes('notes-two') && !panel.textContent.includes('notes-one'));
        deck.querySelector('.slideNext').click();
        check('a slide without notes shows none', !panel.textContent.includes('notes-'));
        check('a picture slide is named by the heading in its notes', panel.querySelector('.slideNotesNext').textContent === '→ 4. 그림 장');
        deck.querySelector('.slideNext').click();
        const notesHeading = panel.querySelector('h3');
        const css = (el, prop) => getComputedStyle(el).getPropertyValue(prop).trim();
        check('a heading in the notes shows no number', !visible(notesHeading.querySelector('.headingNumber')));
        check('a heading in the notes has no underline, shadow or indent',
            css(notesHeading, 'border-bottom-style') === 'none' && css(notesHeading, 'text-shadow') === 'none' && css(notesHeading, 'margin-left') === '0px');
        deck.querySelector('.slidePrev').click();
        deck.querySelector('.slidePrev').click();
        deck.querySelector('.slidePrev').click();

        deck.querySelector('.slideOverview').click();
        check('the overview turns the notes off', !deck.classList.contains('notes'));
        const thumbsNotes = [...deck.querySelectorAll('.slideThumbs .slideNotes')];
        check('thumbnails do not show notes', thumbsNotes.length === 3 && thumbsNotes.every((a) => !visible(a)));
        deck.querySelector('.slideOverview').click();
        // Hidden while another mode is on, not turned off: closing it brings the panel back,
        // as picking a slide in the overview does -- unless N turned it off.
        check('closing the overview brings the notes back', visible(panel));
        deck.querySelector('.slideFilmstrip').click();
        check('the filmstrip hides the notes', !visible(panel));
        deck.querySelector('.slideFilmstrip').click();
        check('closing the filmstrip brings the notes back', visible(panel));
        deck.querySelector('.slideOverview').click();
        deck.querySelector('.slideThumbs .slideThumbItem').click();
        check('picking a slide in the overview brings the notes back', !deck.classList.contains('overview') && visible(panel));
        toggle.click();
        deck.querySelector('.slideOverview').click();
        deck.querySelector('.slideOverview').click();
        check('notes N turned off stay off', !visible(panel));
        toggle.click();

        // The wiki binds F, L and the rest on document (hotkey.scala.html): F went to the front
        // page and L to PageList. The deck takes its keys first and lets none of them through.
        const reached = [];
        const spy = (e) => reached.push(e.key);
        document.addEventListener('keydown', spy);
        const press = (key, init = {}) => deck.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...init }));
        deck.focus();
        press('l');
        check('L opens the filmstrip', deck.classList.contains('filmstrip'));
        press('l');
        press('f');
        press('ArrowRight');
        press('ArrowLeft');
        check('the deck\'s keys do not reach the wiki\'s hotkeys', reached.length === 0);
        press('l', { ctrlKey: true });
        check('with Ctrl a key is left to the browser and the wiki', !deck.classList.contains('filmstrip') && reached.join() === 'l');
        press('e');
        check('a key the deck does not use still reaches them', reached.join() === 'l,e');
        // `?` lists the deck's own keys, over the slide; the wiki's `?` help does not see it.
        press('?', { shiftKey: true });
        const help = deck.querySelector('.slideKeyHelp');
        const helpText = help ? help.textContent : '';
        check('? lists the deck\'s keys', visible(help) && /Fullscreen/.test(helpText) && /Filmstrip/.test(helpText) && /Speaker notes/.test(helpText) && reached.join() === 'l,e');
        press('Escape');
        check('Escape closes the key list', !visible(help));
        press('?', { shiftKey: true });
        help.click();
        check('a click on the key list leaves it open, as the wiki\'s does', visible(help) && deck.querySelector('.slideCurrent').textContent === '1');
        deck.querySelector('.slideKeyHelpBg').click();
        check('a click outside it closes it without moving on', !visible(help) && deck.querySelector('.slideCurrent').textContent === '1');
        // The ? button in the bar, for whoever does not know to press ?: pressed while the list is open.
        const keysBtn = deck.querySelector('.slideKeys');
        keysBtn.click();
        check('the ? button opens the list and shows pressed', visible(help) && keysBtn.getAttribute('aria-pressed') === 'true' && deck.querySelector('.slideCurrent').textContent === '1');
        press('Escape');
        check('Escape lets the ? button up', !visible(help) && keysBtn.getAttribute('aria-pressed') === 'false');
        document.removeEventListener('keydown', spy);
        // A script's F is refused fullscreen; the refusal arrives later, as a rejected promise.
        await new Promise((r) => setTimeout(r, 300));
        check('after F was refused the notes are back', visible(panel));

        // The presenter window: opened on the same page, it follows this deck and this deck follows it.
        const w = window.open(location.href.split('#')[0], AhaWiki.Slide.presenterWindowName(0), 'width=900,height=700');
        if (!w) {
            check('presenter window opened (popup blocked?)', false);
        } else {
            await new Promise((r) => setTimeout(r, 1500));
            const pdeck = w.document.querySelector('.slideDeck');
            check('the presenter window shows notes', pdeck && pdeck.classList.contains('presenterView') && pdeck.classList.contains('notes'));
            check('the presenter window runs its clock', pdeck && !pdeck.querySelector('.slideTimer').hidden);
            deck.querySelector('.slideNext').click();
            await new Promise((r) => setTimeout(r, 300));
            check('the presenter follows the deck', pdeck && pdeck.querySelector('.slideCurrent').textContent === '2');
            pdeck.querySelector('.slideNext').click();
            await new Promise((r) => setTimeout(r, 300));
            check('the deck follows the presenter', deck.querySelector('.slideCurrent').textContent === '3');
            if (!new URLSearchParams(location.search).has('keep')) w.close();
        }
        document.getElementById('result').textContent = out.join('\n');
    });
}
</script>
</body>
</html>
