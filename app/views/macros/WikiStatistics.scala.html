@for(id <- Seq(com.aha00a.commons.utils.UuidUtil.newString)) {
    <div class="">
        <div id="@(id)3">
            <div class="statsGrid">
                <div class="statCard">
                    <div class="statLabel">Total pages</div>
                    <div class="statValue pageCount">0</div>
                </div>
                <div class="statCard">
                    <div class="statLabel">Average page length</div>
                    <div class="statValue avgPageSize">0</div>
                    <div class="statSub">characters</div>
                </div>
                <div class="statCard">
                    <div class="statLabel">Recorded period</div>
                    <div class="statValue recordedPeriod">0</div>
                    <div class="statSub">days</div>
                </div>
                <div class="statCard">
                    <div class="statLabel">Average growth</div>
                    <div class="statValue avgGrowthRateDay">0</div>
                    <div class="statSub">pages / day</div>
                </div>
            </div>

            <p>
                Weekly <strong class="avgGrowthRateWeek">0</strong> / week,
                Monthly <strong class="avgGrowthRateMonth">0</strong> / month,
                Yearly <strong class="avgGrowthRateYear">0</strong> / year
            </p>
        </div>

        <table class="layout" style="width: 100%">
            <thead>
                <cols>
                    <col width="50%"/>
                    <col width="50%"/>
                </cols>
            </thead>
            <tr>
                <td>
                    <div class="aspectRatioWrapper">
                        <div class="ratio_16_9"></div>
                        <div class="aspectRatioContent" id="@{id}1"></div>
                    </div>
                </td>
                <td>
                    <div class="aspectRatioWrapper">
                        <div class="ratio_16_9"></div>
                        <div class="aspectRatioContent" id="@{id}2"></div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <script type="text/javascript">
        $(function () {
            $.ajax({
                url: '@routes.Api.statistics()',
                method: 'get',
                data: {},
                success: function (data, textStatus, jqXHR) {
                    if (!data.arrayArrayYmdCountOfFirstRevision || data.arrayArrayYmdCountOfFirstRevision.length === 0) {
                        return;
                    }

                    var dayjsStart = dayjs(data.arrayArrayYmdCountOfFirstRevision[0][0]);
                    var dayjsEnd = dayjs(data.arrayArrayYmdCountOfFirstRevision[data.arrayArrayYmdCountOfFirstRevision.length - 1][0]);
                    var days = Math.max(dayjsEnd.diff(dayjsStart, 'd') + 1, 1);
                    var mapYmdCountOfFirstRevision = data.arrayArrayYmdCountOfFirstRevision.reduce((a, v) => {
                        a[v[0]] = v[1];
                        return a;
                    }, {});

                    var arrayObjectExpanded = Array.from(Array(days).keys()).map(v => dayjsStart.add(v, 'd')).map(v => ({
                        ymd: v.format('YYYY-MM-DD'),
                        count: mapYmdCountOfFirstRevision[v.format('YYYY-MM-DD')] || 0
                    }));


                    var arrayDate = arrayObjectExpanded.map(function (v) {return v.ymd;});
                    var arrayCount = arrayObjectExpanded.map(function (v) {return v.count;});
                    var acc = 0;
                    var arrayAccumulate = arrayObjectExpanded.map(function (v) {return acc += v.count;});

                    var chart1 = echarts.init(document.getElementById('@{id}1'));
                    var chart2 = echarts.init(document.getElementById('@{id}2'));

                    var option1 = {
                        tooltip: {
                            trigger: 'axis'
                        },
                        xAxis: {
                            type: 'category',
                            boundaryGap: false,
                            data: arrayDate
                        },
                        yAxis: {
                            type: 'value',
                        },
                        dataZoom: [{
                            type: 'inside',
                            start: 0,
                            end: 100,
                        }, {
                            start: 0,
                            end: 100,
                        }],
                        series: [
                            {
                                name: 'count',
                                type: 'bar',
                                data: arrayCount
                            },
                        ]
                    };
                    chart1.setOption(option1);

                    var option2 = {
                        tooltip: {
                            trigger: 'axis'
                        },
                        xAxis: {
                            type: 'category',
                            boundaryGap: false,
                            data: arrayDate
                        },
                        yAxis: {
                            type: 'value',
                        },
                        dataZoom: [{
                            type: 'inside',
                            start: 0,
                            end: 100,
                        }, {
                            start: 0,
                            end: 100,
                        }],
                        series: [
                            {
                                name: 'accumulate',
                                type: 'line',
                                smooth: true,
                                data: arrayAccumulate
                            },
                        ]
                    };

                    chart2.setOption(option2);

                    $(window).on('resize', function(){
                        if(chart1){
                            chart1.resize();
                        }
                        if(chart2){
                            chart2.resize();
                        }
                    });



                    var div3 = $('#@{id}3');
                    div3.find('.pageCount').text(Math.floor(data.pageCount).toLocaleString());
                    div3.find('.avgPageSize').text(Math.floor(data.totalSize / Math.max(data.pageCount, 1)).toLocaleString());
                    div3.find('.avgGrowthRateDay').text((data.pageCount / days).toFixed(3));
                    div3.find('.avgGrowthRateWeek').text((data.pageCount / (days / 7)).toFixed(1));
                    div3.find('.avgGrowthRateMonth').text((data.pageCount / (days / (365.2422 / 12))).toFixed(1));
                    div3.find('.avgGrowthRateYear').text((data.pageCount / (days /  365.2422)).toFixed(1));
                    div3.find('.recordedPeriod').text(days.toLocaleString());
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.error('Failed to load wiki statistics', textStatus, errorThrown);
                }
            });
        });

    </script>
}
