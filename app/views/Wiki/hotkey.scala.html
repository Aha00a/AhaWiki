@(enablePageActions: Boolean = true)
@import helper._
@import com.aha00a.commons.Implicits._
<script type="text/javascript">
    function showToast(message, type) {
        var toast = $('<div></div>')
            .text(message)
            .addClass('ahaWikiToast')
            .addClass(type === 'error' ? 'error' : 'success');
        $('body').append(toast);
        toast.animate({ opacity: 1 }, 150);
        setTimeout(function () {
            toast.animate({ opacity: 0 }, 250, function () {
                toast.remove();
            });
        }, 1600);
    }

    function showSearch() {
        $("body").append($('<div class="searchBg"></div><div class="search"><form action="/search"><input type="text" name="q"/></form></div>'));
        $('.searchBg').click(function () {
            hideSearch();
        });
        $('[name=q]').keydown(function (e) {
            if (e.keyCode == 27) {
                hideSearch();
            }
        }).focus();
        $.get(
                '@routes.Api.pageNames',
                {},
                function (data, textStatus, jqXHR) {
                    $('[name=q]').autocomplete({
                        lookup: data,
                        onSelect: function (suggestion) {
                            hideSearch();
                            go('/w/' + encodeURIComponent(suggestion.value));
                            return false;
                        }
                    }).focus();
                }
        ).fail(function (jqXHR, textStatue, httpStatus) {
            alert(jqXHR.responseJSON.message);
        });
        return false;
    }
    function hideSearch() {
        $('.search, .searchBg').remove();
    }

    // `?` again closes it: each press used to add another on top (2026-11-20).
    function showHotkeyHelp() {
        if ($('.hotkeyHelp').length) {
            hideHotkeyHelp();
            return false;
        }
        var rows = HOTKEYS.map(function (k) {
            return '<tr><th>' + k.shown + '</th><td>' + k.label + '</td></tr>';
        }).join('');

        var popup = [
            '<div class="searchBg hotkeyHelpBg"></div>',
            '<div class="hotkeyHelp">',
            '<h2>Hotkeys</h2>',
            '<p class="description">Press ESC or click outside to close.</p>',
            '<table>' + rows + '</table>',
            '</div>'
        ].join('');

        $('body').append($(popup));
        $('.hotkeyHelpBg').click(function () {
            hideHotkeyHelp();
        });
        $(document).on('keydown.hotkeyHelp', function (e) {
            if (e.keyCode == 27) {
                hideHotkeyHelp();
            }
        });
        return false;
    }

    function hideHotkeyHelp() {
        $('.hotkeyHelp, .hotkeyHelpBg').remove();
        $(document).off('keydown.hotkeyHelp');
    }

    function showWrite() {
        $.ajax({
            url: '@routes.Api.csrf',
            data: {},
            success: function (data, textStatus, jqXHR) {
                var csrfName = data.name;
                var csrfValue = data.value;
                var popupHtml = '' +
                    '<div class="searchBg"></div>' +
                    '<div class="search">' +
                    '<form action="@routes.Diary.write()" method="post">' +
                    '<input type="hidden" name="' + csrfName + '" value="' + csrfValue + '"/>' +
                    '<input type="text" name="q"/>' +
                    '</form>' +
                    '</div>';
                $("body").append($(popupHtml));
                $('.searchBg').click(function () {
                    hideSearch();
                });
                $('[name=q]').keydown(function (e) {
                    if (e.keyCode == 27) {
                        hideSearch();
                    }
                }).focus();
            },
            error: function(jqXHR, textStatus, errorThrown) {
                debugger;
            }
        });
        return false;
    }

    function go(s) {
        location.href = s;
        return true;
    }

    function toggleAction(action) {
        var value = location.params("action");
        if (value && value === action)
            return location.params({action: undefined});

        return location.params({action: action});
    }

    // The wiki's keys, once: the bindings below and the list `?` opens both read this, so the list
    // cannot name a key that does nothing or leave one out (2026-11-20; they were two lists until
    // then). `keys` is jquery.hotkeys' spelling, space-separated; one bind() per entry, so a key
    // that has two spellings -- `?` and `shift+/` -- runs once even where a layout matches both.
    var HOTKEYS = [
        { keys: 'f', shown: 'F', label: 'Front page', run: function () { return go('/'); } },
        { keys: 'a', shown: 'A', label: 'AhaWiki page', run: function () { return go('/w/AhaWiki'); } },
        { keys: 'c', shown: 'C', label: 'RecentChanges', run: function () { return go('/w/RecentChanges'); } },
        { keys: 't', shown: 'T', label: 'TitleIndex', run: function () { return go('/w/TitleIndex'); } },
        { keys: 'l', shown: 'L', label: 'PageList', run: function () { return go('/w/PageList'); } },
        { keys: 'm', shown: 'M', label: 'PageMap', run: function () { return go('/w/PageMap'); } },
        { keys: 'r', shown: 'R', label: 'Random page', run: function () { return go('/r'); } },
@if(enablePageActions) {
        { keys: 'e', shown: 'E', label: 'Edit action toggle', run: function () { return toggleAction('edit'); } },
        { keys: 'h', shown: 'H', label: 'History action toggle', run: function () { return toggleAction('history'); } },
        { keys: 'b', shown: 'B', label: 'Blame action toggle', run: function () { return toggleAction('blame'); } },
}
        { keys: 's g /', shown: 'S, G, /', label: 'Open search', run: function () { return showSearch(); } },
        { keys: 'w', shown: 'W', label: 'Open diary write', run: function () { return showWrite(); } },
        { keys: '? shift+/', shown: '?', label: 'Hotkey help', run: function () { return showHotkeyHelp(); } }
    ];

    $(function(){
        HOTKEYS.forEach(function (k) {
            $(document).bind('keydown', k.keys, k.run);
        });
    });
</script>
