@()
@import helper._
@import com.aha00a.commons.Implicits._
<script type="text/javascript">
    function showToast(message, type) {
        var backgroundColor = type === 'error' ? '#b00020' : '#2e7d32';
        var toast = $('<div></div>').text(message).css({
            position: 'fixed',
            right: '20px',
            bottom: '20px',
            background: backgroundColor,
            color: '#fff',
            padding: '10px 14px',
            borderRadius: '8px',
            zIndex: 9999,
            boxShadow: '0 4px 14px rgba(0, 0, 0, 0.25)',
            fontSize: '13px',
            opacity: 0
        });
        $('body').append(toast);
        toast.animate({ opacity: 1 }, 150);
        setTimeout(function () {
            toast.animate({ opacity: 0 }, 250, function () {
                toast.remove();
            });
        }, 1600);
    }

    function showHabitQuickMenu() {
        var habits = ['Sleep', 'WakeUp', 'Meal', 'Smoke'];
        var buttons = habits.map(function (habit) {
            return '<button type="button" data-habit="' + habit + '" style="border:1px solid #ddd;background:#fafafa;color:#333;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;">' + habit + '</button>';
        }).join('');

        var popup = [
            '<div class="searchBg habitQuickBg"></div>',
            '<div class="search habitQuickMenu" style="max-width:480px;padding:20px;box-sizing:border-box;background-color:#fff;border-radius: 5px;">',
            '<h2 style="margin:0 0 10px 0;">Quick Habit Log</h2>',
            '<p style="margin:0 0 12px 0;color:#777;">기록할 habit을 선택하세요. (Alt+L/W/M/S도 가능)</p>',
            '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + buttons + '</div>',
            '</div>'
        ].join('');

        $('body').append($(popup));
        $('.habitQuickBg').click(function () {
            hideHabitQuickMenu();
        });
        $('.habitQuickMenu').on('click', 'button[data-habit]', function () {
            submitHabitQuick($(this).data('habit'));
            hideHabitQuickMenu();
        });
        $(document).on('keydown.habitQuickMenu', function (e) {
            if (e.keyCode == 27) hideHabitQuickMenu();
        });
        return false;
    }

    function hideHabitQuickMenu() {
        $('.habitQuickMenu, .habitQuickBg').remove();
        $(document).off('keydown.habitQuickMenu');
    }

    function showSearch() {
        $("body").append($('<div class="searchBg"></div><div class="search"><form action="/search"><input type="text" name="q"/></form></div>'));
        $('.searchBg').click(function () {
            hideSearch();
        });
        $('[name=q]').keydown(function (e) {
            if (e.keyCode == 27) {
                hideSearch();
            }
        }).focus();
        $.get(
                '@routes.Api.pageNames',
                {},
                function (data, textStatus, jqXHR) {
                    $('[name=q]').autocomplete({
                        lookup: data,
                        onSelect: function (suggestion) {
                            hideSearch();
                            go('/w/' + suggestion.value);
                            return false;
                        }
                    }).focus();
                }
        ).error(function (jqXHR, textStatue, httpStatus) {
            alert(jqXHR.responseJSON.message);
        });
        return false;
    }
    function hideSearch() {
        $('.search, .searchBg').remove();
    }

    function showHotkeyHelp() {
        var items = [
            ['F', 'Front page'],
            ['A', 'AhaWiki page'],
            ['C', 'RecentChanges'],
            ['T', 'TitleIndex'],
            ['L', 'PageList'],
            ['M', 'PageMap'],
            ['R', 'Random page'],
            ['E', 'Edit action toggle'],
            ['H', 'History action toggle'],
            ['B', 'Blame action toggle'],
            ['S,G,/', 'Open search'],
            ['W', 'Open diary write'],
            ['Alt+L', 'Quick habit log: Sleep'],
            ['Alt+W', 'Quick habit log: WakeUp'],
            ['Alt+M', 'Quick habit log: Meal'],
            ['Alt+S', 'Quick habit log: Smoke'],
            ['?', 'Open hotkey help']
        ];
        var rows = items.map(function (item) {
            return '<tr><th style="text-align:left;white-space:nowrap;padding:6px 16px 6px 0;">' + item[0] + '</th><td style="padding:6px 0;">' + item[1] + '</td></tr>';
        }).join('');

        var popup = [
            '<div class="searchBg hotkeyHelpBg"></div>',
            '<div class="search hotkeyHelp" style="max-width:560px;padding:24px;box-sizing:border-box;background-color:#fff;border-radius: 5px;">',
            '<h2 style="margin:0 0 12px 0;">Hotkeys</h2>',
            '<p style="margin:0 0 16px 0;color:#777;">Press ESC or click outside to close.</p>',
            '<table style="width:100%;border-collapse:collapse;">' + rows + '</table>',
            '</div>'
        ].join('');

        $('body').append($(popup));
        $('.hotkeyHelpBg').click(function () {
            hideHotkeyHelp();
        });
        $(document).on('keydown.hotkeyHelp', function (e) {
            if (e.keyCode == 27) {
                hideHotkeyHelp();
            }
        });
        return false;
    }

    function hideHotkeyHelp() {
        $('.hotkeyHelp, .hotkeyHelpBg').remove();
        $(document).off('keydown.hotkeyHelp');
    }

    function showWrite() {
        $.ajax({
            url: '@routes.Api.csrf',
            data: {},
            success: function (data, textStatus, jqXHR) {
                var csrfName = data.name;
                var csrfValue = data.value;
                var popupHtml = '' +
                    '<div class="searchBg"></div>' +
                    '<div class="search">' +
                    '<form action="@routes.Diary.write()" method="post">' +
                    '<input type="hidden" name="' + csrfName + '" value="' + csrfValue + '"/>' +
                    '<input type="text" name="q"/>' +
                    '</form>' +
                    '</div>';
                $("body").append($(popupHtml));
                $('.searchBg').click(function () {
                    hideSearch();
                });
                $('[name=q]').keydown(function (e) {
                    if (e.keyCode == 27) {
                        hideSearch();
                    }
                }).focus();
            },
            error: function(jqXHR, textStatus, errorThrown) {
                debugger;
            }
        });
        return false;
    }

    function submitHabitQuick(habit) {
        $.ajax({
            url: '@routes.Api.csrf',
            data: {},
            success: function (data) {
                var payload = { habit: habit };
                payload[data.name] = data.value;
                $.ajax({
                    url: '/api/habit',
                    method: 'POST',
                    data: payload,
                    success: function () {
                        showToast('Habit Saved: ' + habit);
                    },
                    error: function (jqXHR) {
                        var message = (jqXHR && jqXHR.responseJSON && jqXHR.responseJSON.error) || 'Failed to save habit log.';
                        showToast(message, 'error');
                    }
                });
            },
            error: function () {
                showToast('Failed to fetch CSRF token.', 'error');
            }
        });
    }

    function go(s) {
        location.href = s;
        return true;
    }

    function toggleAction(action) {
        var value = location.params("action");
        if (value && value === action)
            return location.params({action: undefined});

        return location.params({action: action});
    }

    $(function(){
        $(document).bind('keydown', 'f', function () { return go('/'); });

        $(document).bind('keydown', 'a', function () { return go('/w/AhaWiki'); });

        $(document).bind('keydown', 'c', function () { return go('/w/RecentChanges'); });
        $(document).bind('keydown', 't', function () { return go('/w/TitleIndex'); });
        $(document).bind('keydown', 'l', function () { return go('/w/PageList'); });

        $(document).bind('keydown', 'm', function () { return go('/w/PageMap'); });

        $(document).bind('keydown', 'r', function () { return go('/r'); });

        $(document).bind('keydown', 'e', function () { return toggleAction('edit'); });
        $(document).bind('keydown', 'h', function () { return toggleAction('history'); });
        $(document).bind('keydown', 'b', function () { return toggleAction('blame'); });

        $(document).bind('keydown', 's', function () { return showSearch(); });
        $(document).bind('keydown', 'g', function () { return showSearch(); });
        $(document).bind('keydown', '/', function () { return showSearch(); });

        $(document).bind('keydown', '?', function () { return showHotkeyHelp(); });
        $(document).bind('keydown', 'shift+/', function () { return showHotkeyHelp(); });

        $(document).bind('keydown', 'w', function () { return showWrite(); });
        $(document).on('keydown', function (e) {
            if (!e.altKey) return;
            var targetTagName = String(e.target && e.target.tagName || '');
            var isEditable = targetTagName === 'input' || targetTagName === 'textarea' || (e.target && e.target.isContentEditable);
            if (isEditable) return;
            var key = String(e.key || '').toLowerCase();
            var map = {
                l: 'Sleep',
                w: 'WakeUp',
                m: 'Meal',
                s: 'Smoke'
            };
            var habit = map[key];
            if (!habit) return;
            e.preventDefault();
            submitHabitQuick(habit);
        });
    });
</script>
