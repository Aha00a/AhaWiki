@import models.ContextWikiPage
@(id:String, content:String, defaultEst:Int)(implicit wikiContext:ContextWikiPage)
<div class="Interpreter InterpreterGantt" id="@id" data-page-name="@wikiContext.name" data-default-est="@defaultEst">
    <pre class="gantt-source">@content</pre>
    <div class="gantt-container"></div>
</div>
