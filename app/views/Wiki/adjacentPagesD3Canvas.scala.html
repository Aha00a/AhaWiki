@(id:String, enableWikiLink:Boolean)(implicit wikiContext: ContextWikiPage)

<script type="text/javascript">
    $(function() {
        var canvasSelector = '#graphD3Canvas-@(id)';
        var canvas = $(canvasSelector).get(0);
        var ctx = canvas.getContext('2d');

        var state = {
            simulation: null,
            intervalFetch: null,
            intervalGraph: null,
            queueFetch: [],
            queueGraph: [],
            limit: 1000,
            running: false,
            nodeById: new Map(),
            linkKeySet: new Set(),
            adjacency: new Map(),
            nodes: [],
            links: [],
            rootNodeName: null,
            hoverNodeId: null,
            mouseDownAt: 0,
            mouseDownNodeId: null,
            dragNode: null,
            isPanning: false,
            panX: 0,
            panY: 0,
            scale: 1,
            lastMouseX: 0,
            lastMouseY: 0,
            nodeDegree: new Map(),
            depthFromRoot: new Map(),
            focusDepth: 3,
            minDegree: 0,
        };

        var intervalFetchMs = 100;
        var intervalAddMs = 30;
        var graphBatchSize = 40;
        var radiusDefault = 7;
        var radiusHighlight = 15;

        function syncCanvasSize() {
            var $el = $(canvasSelector);
            var w = $el.width() || 800;
            var h = $el.height() || 450;
            if(canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
            return { width: w, height: h };
        }

        function addAdj(src, dst) {
            if(!state.adjacency.has(src)) state.adjacency.set(src, new Set());
            if(!state.adjacency.has(dst)) state.adjacency.set(dst, new Set());
            state.adjacency.get(src).add(dst);
            state.adjacency.get(dst).add(src);
        }

        function removeAdj(src, dst) {
            if(state.adjacency.has(src)) state.adjacency.get(src).delete(dst);
            if(state.adjacency.has(dst)) state.adjacency.get(dst).delete(src);
        }

        function getNode(id) {
            return state.nodeById.get(id);
        }

        function ensureNode(id) {
            var node = getNode(id);
            if(node) return node;
            node = { id: id };
            state.nodeById.set(id, node);
            state.nodes.push(node);
            return node;
        }

        function linkKey(src, dst) {
            return src + '->' + dst;
        }

        function addLink(src, dst) {
            var key = linkKey(src, dst);
            if(state.linkKeySet.has(key)) return false;
            state.linkKeySet.add(key);
            addAdj(src, dst);
            state.links.push({ source: src, target: dst, key: key });
            return true;
        }

        function updateCounter() {
            var visibleNodes = state.nodes.filter(isNodeVisible).length;
            $('.linkCountD3Canvas.@(id)').text(visibleNodes + '/' + state.nodes.length + ' Nodes, ' + state.links.length + ' Links');
        }

        function worldToScreen(x, y) {
            return { x: x * state.scale + state.panX, y: y * state.scale + state.panY };
        }

        function screenToWorld(x, y) {
            return { x: (x - state.panX) / state.scale, y: (y - state.panY) / state.scale };
        }

        function buildDepthMap(originId, maxDepth) {
            var result = new Map();
            if(!originId) return result;
            var queue = [{ id: originId, depth: 0 }];
            result.set(originId, 0);
            while(queue.length > 0) {
                var cur = queue.shift();
                if(cur.depth >= maxDepth) continue;
                var neighbors = state.adjacency.get(cur.id) || new Set();
                neighbors.forEach(function(nextId) {
                    if(result.has(nextId)) return;
                    result.set(nextId, cur.depth + 1);
                    queue.push({ id: nextId, depth: cur.depth + 1 });
                });
            }
            return result;
        }

        function recomputeDerivedGraphState() {
            state.nodeDegree = new Map();
            state.links.forEach(function(l) {
                var src = l.source.id ? l.source.id : l.source;
                var dst = l.target.id ? l.target.id : l.target;
                state.nodeDegree.set(src, (state.nodeDegree.get(src) || 0) + 1);
                state.nodeDegree.set(dst, (state.nodeDegree.get(dst) || 0) + 1);
            });
            state.depthFromRoot = buildDepthMap(state.rootNodeName, 8);
        }

        function isNodeVisible(node) {
            var depth = state.depthFromRoot.has(node.id) ? state.depthFromRoot.get(node.id) : 999;
            var degree = state.nodeDegree.get(node.id) || 0;
            var keepByDepth = depth <= state.focusDepth || node.id === state.rootNodeName;
            var keepByDegree = degree >= state.minDegree || node.id === state.rootNodeName;
            return keepByDepth && keepByDegree;
        }

        function draw() {
            var size = syncCanvasSize();
            ctx.clearRect(0, 0, size.width, size.height);
            var bg = ctx.createLinearGradient(0, 0, 0, size.height);
            bg.addColorStop(0, '#f8faff');
            bg.addColorStop(1, '#f2f4f9');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, size.width, size.height);

            var neighbors = state.hoverNodeId ? (state.adjacency.get(state.hoverNodeId) || new Set()) : new Set();
            var hop2 = state.hoverNodeId ? buildDepthMap(state.hoverNodeId, 2) : new Map();

            state.links.forEach(function(l) {
                var src = l.source.id ? l.source.id : l.source;
                var dst = l.target.id ? l.target.id : l.target;
                var sNode = l.source.id ? l.source : getNode(src);
                var tNode = l.target.id ? l.target : getNode(dst);
                if(!sNode || !tNode) return;
                if(!isNodeVisible(sNode) || !isNodeVisible(tNode)) return;

                var highlighted = state.hoverNodeId && (src === state.hoverNodeId || dst === state.hoverNodeId || (neighbors.has(src) && neighbors.has(dst)));
                var inHop2 = hop2.has(src) && hop2.has(dst);
                ctx.strokeStyle = highlighted ? '#2b5fc7' : (inHop2 ? '#7396df' : '#b2bdcf');
                ctx.globalAlpha = highlighted ? 0.95 : (inHop2 ? 0.55 : 0.25);
                ctx.lineWidth = highlighted ? 2.2 : 1;
                var s = worldToScreen(sNode.x || 0, sNode.y || 0);
                var t = worldToScreen(tNode.x || 0, tNode.y || 0);
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(t.x, t.y);
                ctx.stroke();
            });

            ctx.globalAlpha = 1;
            state.nodes.forEach(function(n) {
                if(!isNodeVisible(n)) return;
                var isRoot = n.id === state.rootNodeName;
                var isHover = n.id === state.hoverNodeId;
                var isNeighbor = state.hoverNodeId && neighbors.has(n.id);
                var depth = state.depthFromRoot.has(n.id) ? state.depthFromRoot.get(n.id) : 99;
                var degree = state.nodeDegree.get(n.id) || 0;
                var r = Math.min(18, radiusDefault + Math.log(degree + 1) * 2);
                if(isRoot || isHover) r = Math.max(r, radiusHighlight);
                var rScreen = Math.max(2, r * state.scale);
                var p = worldToScreen(n.x || 0, n.y || 0);

                ctx.beginPath();
                ctx.fillStyle = isRoot ? '#213a9a' : (isHover ? '#2b5fc7' : (isNeighbor ? '#6a8fe0' : (depth <= 1 ? '#3f7bcf' : (depth <= 2 ? '#7ea2df' : '#9099ab'))));
                ctx.arc(p.x, p.y, rScreen, 0, Math.PI * 2);
                ctx.fill();
                if(isRoot) {
                    ctx.strokeStyle = '#ffb300';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }

                ctx.fillStyle = isRoot ? '#1e2f80' : '#23314a';
                ctx.font = (isRoot || isHover) ? 'bold 13px sans-serif' : '12px sans-serif';
                ctx.fillText(n.id, p.x + rScreen + 4, p.y + 4);
            });
        }

        function createSimulation() {
            if(state.simulation) state.simulation.stop();
            var size = syncCanvasSize();
            state.simulation = d3.forceSimulation(state.nodes)
                .force('link', d3.forceLink(state.links).id(function(d) { return d.id; }).distance(80))
                .force('charge', d3.forceManyBody().strength(-120))
                .force('center', d3.forceCenter(size.width / 2, size.height / 2));
            state.simulation.on('tick', draw);
            recomputeDerivedGraphState();
        }

        function restart() {
            if(!state.simulation) return;
            state.simulation.nodes(state.nodes);
            state.simulation.force('link').links(state.links);
            state.simulation.alpha(0.8).restart();
            recomputeDerivedGraphState();
            updateCounter();
            draw();
        }

        function removeNodeAndLinks(nodeId) {
            state.links = state.links.filter(function (l) {
                var s = l.source.id ? l.source.id : l.source;
                var t = l.target.id ? l.target.id : l.target;
                var remove = s === nodeId || t === nodeId;
                if(remove) {
                    state.linkKeySet.delete(linkKey(s, t));
                    removeAdj(s, t);
                }
                return !remove;
            });
            state.nodes = state.nodes.filter(function (n) { return n.id !== nodeId; });
            state.nodeById.delete(nodeId);
            state.adjacency.delete(nodeId);
            updateCounter();
            restart();
        }

        function fetchLinks(name) {
            $.ajax({
                url: '/api/links/' + name,
                success: function(data) {
                    if(data.length === 1) {
                        var node = getNode(name);
                        if(node && !(node.fx != null || node.fy != null)) {
                            removeNodeAndLinks(name);
                            return;
                        }
                    }
                    state.queueGraph = state.queueGraph.concat(data);
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.log(name, jqXHR, textStatus, errorThrown);
                }
            });
        }

        function processQueueFetch() {
            if(document.hidden || state.queueFetch.length === 0 || state.nodes.length > state.limit) return;
            fetchLinks(state.queueFetch.shift());
        }

        function processQueueGraph() {
            if(state.queueGraph.length === 0) return;
            var changed = false;
            var consumed = 0;
            while(state.queueGraph.length > 0 && consumed < graphBatchSize) {
                var v = state.queueGraph.shift();
                if(!getNode(v.src)) {
                    ensureNode(v.src);
                    state.queueFetch.push(v.src);
                    changed = true;
                }
                if(!getNode(v.dst)) {
                    ensureNode(v.dst);
                    state.queueFetch.push(v.dst);
                    changed = true;
                }
                changed = addLink(v.src, v.dst) || changed;
                consumed++;
            }
            if(changed) restart();
            else {
                recomputeDerivedGraphState();
                updateCounter();
            }
        }

        function clearIntervals() {
            if(state.intervalFetch) clearInterval(state.intervalFetch);
            if(state.intervalGraph) clearInterval(state.intervalGraph);
            state.intervalFetch = null;
            state.intervalGraph = null;
        }

        function start() {
            if(state.running) {
                state.simulation.alphaTarget(0.3).restart();
                return;
            }
            state.running = true;
            state.simulation.alphaTarget(0.3).restart();
            state.intervalFetch = setInterval(processQueueFetch, intervalFetchMs);
            state.intervalGraph = setInterval(processQueueGraph, intervalAddMs);
            $('.playPauseD3Canvas.@(id)').addClass('play').find('i.fas').removeClass('fa-play').addClass('fa-stop');
            $('.playPauseLabelD3Canvas.@(id)').text('Pause');
        }

        function stop() {
            state.running = false;
            if(state.simulation) state.simulation.stop();
            clearIntervals();
            $('.playPauseD3Canvas.@(id)').removeClass('play').find('i.fas').removeClass('fa-stop').addClass('fa-play');
            $('.playPauseLabelD3Canvas.@(id)').text('Play');
        }

        function nodeAt(screenX, screenY) {
            for(var i = state.nodes.length - 1; i >= 0; i--) {
                var n = state.nodes[i];
                if(!isNodeVisible(n)) continue;
                var degree = state.nodeDegree.get(n.id) || 0;
                var r = Math.min(18, radiusDefault + Math.log(degree + 1) * 2);
                if(n.id === state.rootNodeName) r = Math.max(r, radiusHighlight);
                var p = worldToScreen(n.x || 0, n.y || 0);
                var rScreen = Math.max(2, r * state.scale);
                var dx = p.x - screenX;
                var dy = p.y - screenY;
                if(dx * dx + dy * dy <= (rScreen + 3) * (rScreen + 3)) return n;
            }
            return null;
        }

        function bindCanvasEvents() {
            $(canvasSelector).off('.d3canvas@(id)');
            $(canvasSelector).on('mousemove.d3canvas@(id)', function(e) {
                var rect = canvas.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var world = screenToWorld(x, y);
                if(state.dragNode) {
                    state.dragNode.fx = world.x;
                    state.dragNode.fy = world.y;
                    state.simulation.alphaTarget(0.3).restart();
                    draw();
                    return;
                }
                if(state.isPanning) {
                    state.panX += (x - state.lastMouseX);
                    state.panY += (y - state.lastMouseY);
                    state.lastMouseX = x;
                    state.lastMouseY = y;
                    draw();
                    return;
                }
                var n = nodeAt(x, y);
                state.hoverNodeId = n ? n.id : null;
                draw();
            });
            $(canvasSelector).on('wheel.d3canvas@(id)', function(e) {
                e.preventDefault();
                var rect = canvas.getBoundingClientRect();
                var x = e.originalEvent.clientX - rect.left;
                var y = e.originalEvent.clientY - rect.top;
                var worldBefore = screenToWorld(x, y);
                var zoomFactor = e.originalEvent.deltaY < 0 ? 1.1 : 0.9;
                state.scale = Math.max(0.35, Math.min(2.5, state.scale * zoomFactor));
                state.panX = x - worldBefore.x * state.scale;
                state.panY = y - worldBefore.y * state.scale;
                draw();
            });
            $(canvasSelector).on('mousedown.d3canvas@(id)', function(e) {
                var rect = canvas.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var world = screenToWorld(x, y);
                var n = nodeAt(x, y);
                state.mouseDownAt = new Date().getTime();
                state.mouseDownNodeId = n ? n.id : null;
                state.lastMouseX = x;
                state.lastMouseY = y;
                if(n) {
                    state.dragNode = n;
                    n.fx = world.x;
                    n.fy = world.y;
                    state.simulation.alphaTarget(0.3).restart();
                } else {
                    state.isPanning = true;
                }
            });
            $(canvasSelector).on('mouseup.d3canvas@(id)', function(e) {
                var rect = canvas.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var world = screenToWorld(x, y);
                var n = nodeAt(x, y);
                var diff = new Date().getTime() - state.mouseDownAt;
                if(n && state.mouseDownNodeId === n.id && diff < 300) {
                    @if(enableWikiLink) {
                    stop();
                    location.href = '/w/' + n.id;
                    }
                } else if(n) {
                    fetchLinks(n.id);
                }
                if(state.dragNode) {
                    state.dragNode.fx = world.x;
                    state.dragNode.fy = world.y;
                    state.dragNode = null;
                }
                state.isPanning = false;
                state.simulation.alphaTarget(0);
                state.mouseDownNodeId = null;
            });
            $(canvasSelector).on('mouseleave.d3canvas@(id)', function() {
                state.hoverNodeId = null;
                state.isPanning = false;
                if(state.dragNode) {
                    state.dragNode = null;
                    state.simulation.alphaTarget(0);
                }
                draw();
            });
        }

        function render() {
            clearIntervals();
            state.limit = 1000;
            state.queueFetch = [];
            state.queueGraph = [];
            state.nodeById = new Map();
            state.linkKeySet = new Set();
            state.adjacency = new Map();
            state.nodes = [];
            state.links = [];
            state.nodeDegree = new Map();
            state.depthFromRoot = new Map();
            state.hoverNodeId = null;
            state.panX = 0;
            state.panY = 0;
            state.scale = 1;

            var wikiContextName = $('.aspectRatioWrapper.@(id) input[name=wikiContextName]').val();
            state.rootNodeName = wikiContextName;
            var size = syncCanvasSize();
            var root = ensureNode(wikiContextName);
            root.fx = size.width / 2;
            root.fy = size.height / 2;
            state.queueFetch = [wikiContextName];

            createSimulation();
            bindCanvasEvents();
            restart();
            start();
        }

        $('.playPauseD3Canvas.@(id)').click(function() {
            if($(this).hasClass('play')) stop();
            else start();
            return false;
        });

        $('.moreD3Canvas.@(id)').click(function() {
            state.limit = state.nodes.length + 1000;
            return false;
        });

        $('.focusDepthD3Canvas.@(id)').on('input change', function() {
            state.focusDepth = parseInt($(this).val(), 10);
            $('.focusDepthValueD3Canvas.@(id)').text(state.focusDepth + '-hop');
            updateCounter();
            draw();
        });

        $('.degreeFilterD3Canvas.@(id)').on('input change', function() {
            state.minDegree = parseInt($(this).val(), 10);
            $('.degreeFilterValueD3Canvas.@(id)').text(state.minDegree === 0 ? 'all' : ('≥ ' + state.minDegree));
            updateCounter();
            draw();
        });

        $(document).on('adjacent-pages-d3canvas:rerender-@(id)', function() {
            render();
        });

        window['adjacentPagesD3CanvasEngine@(id)'] = {
            render: render,
            start: start,
            stop: stop,
        };
    });
</script>
