@(seqSite: Seq[models.tables.Site])
@views.html.Admin._baseAdmin("All Sites", "Manage all sites") {
    <script type="module" src="/public/js/babel/admin.js"></script>
} {
    <div id="main" data-admin-page="sites" style="padding: 20px;">
        <h1>All Sites (Fallback)</h1>
        <table class="simpleTable">
            <thead>
                <tr>
                    <th>Seq</th>
                    <th>Name</th>
                </tr>
            </thead>
            <tbody>
                @for(site <- seqSite) {
                    <tr>
                        <td>@site.seq</td>
                        <td>@site.name</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
}
