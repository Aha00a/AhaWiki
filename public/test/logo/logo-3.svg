    <rect x="10" y="8" width="22" height="8" rx="3"/>
    <rect x="10" y="84" width="22" height="8" rx="3"/>
    <!-- Right bracket ] rounded -->
    <rect x="82" y="8" width="8" height="84" rx="3"/>
    <rect x="68" y="8" width="22" height="8" rx="3"/>
    <rect x="68" y="84" width="22" height="8" rx="3"/>
